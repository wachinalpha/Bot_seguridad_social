services:
  # ==========================================
  # Backend: FastAPI + RAG
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: rag_app/Dockerfile
      target: development
    container_name: bot-seguridad-backend
    ports:
      - "8000:8000"
    volumes:
      # Persistent data with version isolation
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/corpora:/app/data/corpora
      - ./data/logs:/app/data/logs
      # Code for hot reload (comment out for production)
      - ./rag_app:/app/rag_app
      - backend_venv:/app/rag_app/.venv   # clave
    env_file:
      - .env
    environment:
      # Paths with version isolation
      - CHROMA_DB_PATH=/app/data/chroma_db/${CORPUS_VERSION:-v1}
      - CORPUS_STORAGE_PATH=/app/data/corpora
      - CORPUS_VERSION=${CORPUS_VERSION:-v1}
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bot-network
    restart: unless-stopped

  # ==========================================
  # Frontend: React + Vite
  # ==========================================
  frontend:
    build:
      context: ./front
      target: development
    container_name: bot-seguridad-frontend
    ports:
      - "5173:5173"
    volumes:
      # Code for hot module replacement
      - ./front:/app
      # Prevent node_modules conflicts
      - /app/node_modules
    environment:
      # NO API key - frontend calls backend only
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bot-network
    restart: unless-stopped

  # ==========================================
  # Corpus Tools: fetch + index jobs
  # ==========================================
  corpus-tools:
    build:
      context: .
      dockerfile: rag_app/Dockerfile
      target: development
    container_name: bot-seguridad-corpus-tools
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/corpora:/app/data/corpora
      - ./data/logs:/app/data/logs
      - ./rag_app:/app/rag_app
      - backend_venv:/app/rag_app/.venv
    env_file:
      - .env
    environment:
      - CHROMA_DB_PATH=/app/data/chroma_db/${CORPUS_VERSION:-v1}
      - CORPUS_STORAGE_PATH=/app/data/corpora
      - CORPUS_VERSION=${CORPUS_VERSION:-v1}
    networks:
      - bot-network
    profiles:
      - tools
    command: ["sleep", "infinity"]


networks:
  bot-network:
    driver: bridge

volumes:
  backend_venv:

# ==========================================
# Usage:
# ==========================================
# Development:
#   docker compose up --build
#
# Fetch corpus release:
#   docker compose run --rm corpus-tools uv run python /app/rag_app/scripts/fetch_corpus.py --version v1 --repo wachinalpha/anses-corpus
#
# Reset database for current version:
#   docker compose run --rm corpus-tools uv run python /app/rag_app/scripts/reset_db.py --force
#
# Index current corpus version:
#   docker compose run --rm corpus-tools uv run python /app/rag_app/scripts/index_corpus.py --version v1
#
# List all versions:
#   ls -l data/corpora/
#
# Stop services:
#   docker compose down
#
# Remove volumes:
#   docker compose down -v
